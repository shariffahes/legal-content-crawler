[project]
name = "wrc-pipeline"
version = "0.1.0"
description = "Scrapy ingestion and transformation pipeline for legal document sources"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "pymongo>=4.8",
    "boto3>=1.35",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "parsel>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
